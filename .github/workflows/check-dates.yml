name: Check AI Act dates

# The site once claimed "most rules start 2 August 2026" for months after that
# stopped being true. This job makes that class of mistake fail loudly.
on:
  push:
  pull_request:

jobs:
  check-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan for stale EU AI Act claims
        run: node tools/check-dates.mjs
